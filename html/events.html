<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Playground</title>
</head>
<body>

    <h1>Event Playground</h1>

    <!-- Click -->
    <h2>1. Click Event</h2>
    <button id="btnClick">Bấm vào đây</button>
    <p id="clickResult"></p>

    <hr>

    <!-- Change -->
    <h2>2. Change Event</h2>
    <label>Chọn màu:</label>
    <select id="colorSelect">
        <option value="">-- Chọn màu --</option>
        <option value="red">Đỏ</option>
        <option value="blue">Xanh dương</option>
        <option value="green">Xanh lá</option>
    </select>

    <p id="colorResult">Màu sẽ hiển thị ở đây</p>

    <hr>

    <!-- Keyup -->
    <h2>3. Keyup Event</h2>
    <input type="text" id="nameInput" placeholder="Nhập tên của bạn">
    <p>Xem trước: <span id="previewName"></span></p>

    <hr>

    <!-- Submit -->
    <h2>4. Submit Event</h2>
    <form id="myForm">
        <input type="text" placeholder="Nhập email">
        <button type="submit">Gửi</button>
    </form>

    <p id="submitResult"></p>

    <script src="../js/events.js"></script>

</body>
</html>
